<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Box</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="grid min-h-screen place-items-center bg-[linear-gradient(rgba(30,42,34,0.05)_1px,transparent_1px),linear-gradient(90deg,rgba(30,42,34,0.05)_1px,transparent_1px),#eef2e8] bg-[size:32px_32px] font-[Georgia,'Times_New_Roman',serif] text-[#1e2a22]">
  <main class="w-[min(680px,calc(100%-32px))] rounded-lg border border-[#d3dacb] bg-[#fffdf6] px-7 py-7 shadow-[0_18px_50px_rgba(45,66,50,0.12)] sm:px-14 sm:py-14">
    <label for="message" class="mb-3 block text-[clamp(22px,5vw,32px)] font-bold">Your text</label>
    <textarea id="message" name="message" placeholder="Start typing..." class="min-h-[220px] w-full resize-y rounded-md border border-[#9aa993] bg-[#fffffb] p-[18px] text-[18px] leading-[1.5] text-[#1e2a22] outline-none placeholder:text-[#7b887f] focus:border-[#52705b] focus:ring-4 focus:ring-[rgba(82,112,91,0.14)]"></textarea>
  </main>
</body>
</html>
