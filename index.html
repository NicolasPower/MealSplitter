<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Box</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="grid min-h-screen place-items-center bg-[linear-gradient(rgba(30,42,34,0.05)_1px,transparent_1px),linear-gradient(90deg,rgba(30,42,34,0.05)_1px,transparent_1px),#eef2e8] bg-[size:32px_32px] font-[Georgia,'Times_New_Roman',serif] text-[#1e2a22]">
  <main class="w-[min(680px,calc(100%-32px))] rounded-lg border border-[#d3dacb] bg-[#fffdf6] px-7 py-7 shadow-[0_18px_50px_rgba(45,66,50,0.12)] sm:px-14 sm:py-14">
    <section class="mb-6 rounded-md border border-[#d3dacb] bg-[#f8faF3] p-4" aria-labelledby="saved-meals-heading">
      <h2 id="saved-meals-heading" class="mb-3 text-lg font-bold">Saved meals</h2>
      <div class="flex gap-2">
        <select id="saved-meals" class="min-w-0 flex-1 rounded-md border border-[#9aa993] bg-[#fffffb] px-3 py-2 outline-none focus:border-[#52705b]">
          <option value="">Select a saved meal</option>
        </select>
        <button id="delete-meal" type="button" class="rounded-md border border-[#b56b66] px-3 py-2 font-bold text-[#8a3f3a] disabled:cursor-not-allowed disabled:opacity-50" disabled>
          Delete
        </button>
      </div>
    </section>
    <div class="mb-4 flex gap-2">
      <input id="recipe-url" name="recipe-url" type="url" placeholder="Paste recipe URL" aria-label="Recipe URL" class="min-w-0 flex-1 rounded-md border border-[#9aa993] bg-[#fffffb] px-4 py-3 outline-none focus:border-[#52705b] focus:ring-4 focus:ring-[rgba(82,112,91,0.14)]" />
      <button id="import-recipe" type="button" class="rounded-md border border-[#52705b] px-4 py-3 font-bold text-[#52705b] transition hover:bg-[#edf3e8] disabled:cursor-not-allowed disabled:opacity-60">
        Import
      </button>
    </div>
    <label for="message" class="mb-3 block text-[clamp(22px,5vw,32px)] font-bold">Foods</label>
    <textarea id="message" name="message" placeholder="- [ ] 4 chicken breasts&#10;- [ ] 3 garlic cloves&#10;- [ ] 100 g Greek yoghurt&#10;- [ ] 3 tbsp curry powder" class="min-h-[220px] w-full resize-y rounded-md border border-[#9aa993] bg-[#fffffb] p-[18px] text-[18px] leading-[1.5] text-[#1e2a22] outline-none placeholder:text-[#7b887f] focus:border-[#52705b] focus:ring-4 focus:ring-[rgba(82,112,91,0.14)]"></textarea>
    <div class="mt-4">
      <label for="servings" class="mb-2 block font-bold">Number of servings</label>
      <input id="servings" name="servings" type="number" min="1" max="50" step="1" value="1" class="w-full rounded-md border border-[#9aa993] bg-[#fffffb] px-4 py-3 text-[18px] outline-none focus:border-[#52705b] focus:ring-4 focus:ring-[rgba(82,112,91,0.14)]" />
    </div>
    <div class="mt-4 flex gap-2">
      <input id="meal-name" name="meal-name" type="text" maxlength="100" placeholder="Meal name" class="min-w-0 flex-1 rounded-md border border-[#9aa993] bg-[#fffffb] px-4 py-3 outline-none focus:border-[#52705b] focus:ring-4 focus:ring-[rgba(82,112,91,0.14)]" />
      <button id="save-meal" type="button" class="rounded-md border border-[#52705b] px-4 py-3 font-bold text-[#52705b] transition hover:bg-[#edf3e8]">
        Save meal
      </button>
    </div>
    <button id="search-foods" type="button" class="mt-4 w-full rounded-md bg-[#52705b] px-4 py-3 font-bold text-white transition hover:bg-[#415d49] disabled:cursor-not-allowed disabled:opacity-60">
      Search USDA FoodData Central
    </button>
    <div id="food-results" class="mt-4 hidden rounded-md border border-[#d3dacb] bg-white p-4"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
